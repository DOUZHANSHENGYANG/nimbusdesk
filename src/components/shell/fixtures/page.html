<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><div id="root"></div><script type="module">
import {mockIPC,mockWindows} from '@tauri-apps/api/mocks';
const fixtures={settings:{version:3,state:{theme:'dark',lang:'zh'}}};
window.modalReview={fixtures,calls:[]};
mockIPC(async(cmd,args)=>{
 window.modalReview.calls.push({cmd,args});
 if(cmd==='read_json')return structuredClone(fixtures[args.key]??null);
 if(cmd==='write_json'){fixtures[args.key]=structuredClone(args.value);return args.value;}
 if(cmd==='get_data_dir')return 'E:/ModalFixture';
 if(cmd==='plugin:event|listen')return args?.handler??null;
 if(cmd.startsWith('plugin:event|'))return null;
 if(/^list_|_list$/.test(cmd))return [];
 return null;
},{shouldMockEvents:true});
mockWindows('main');
await import('/src/index.css');
const React=(await import('react')).default;
const {createRoot}=await import('react-dom/client');
const {I18nextProvider}=await import('react-i18next');
const {i18n}=await import('/src/lib/i18n.ts');
const {ModalProvider,useModal}=await import('/src/components/shell/modal-host.tsx');

/** 记录每次弹窗的结算结果，供浏览器断言使用 */
window.modalReview.results=[];
function Harness(){
 const {confirm,alert,prompt}=useModal();
 const store=(kind,value)=>window.modalReview.results.push({kind,value});
 return React.createElement('div',{style:{padding:24,display:'flex',flexDirection:'column',gap:12}},
  React.createElement('button',{id:'ask-confirm',onClick:()=>{void confirm({title:'删除这个条目？',description:'会同时删除磁盘文件。',confirmText:'删除',cancelText:'取消',danger:true}).then(v=>store('confirm',v));}},'确认一下'),
  React.createElement('button',{id:'ask-prompt',onClick:()=>{void prompt({title:'给它起个名字',initial:'草稿'}).then(v=>store('prompt',v));}},'改个名字'),
  React.createElement('button',{id:'ask-alert',onClick:()=>{void alert({title:'已完成',okText:'好'}).then(()=>store('alert',true));}},'提示一下'),
  React.createElement('p',{id:'results'},''));
}
createRoot(document.getElementById('root')).render(
 React.createElement(I18nextProvider,{i18n},React.createElement(ModalProvider,null,React.createElement(Harness))));
</script></body></html>
