<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><div id="root"></div><script type="module">
import {mockIPC,mockWindows} from '@tauri-apps/api/mocks';
import {emitTo} from '@tauri-apps/api/event';
import {groupKey} from '/src/features/desktop/queue-core.ts';
const params=new URLSearchParams(location.search),date='2099-10-18',fence=params.has('fence');
const normal={x:220,y:170,w:300,h:380},form=params.has('docked')?'capsule':'paper';
const fixtures={settings:{state:{theme:'dark',lang:'zh',autoClearDone:false,autoSortDone:false},version:3},'todo-papers':{state:{papers:{[date]:{...normal,form,open:true,pinned:true}},order:[date]},version:1},plans:{state:{days:{[date]:[{id:'task',title:'Owned edge task',parentId:null,done:false,createdAt:1,updatedAt:1},{id:'child',title:'Owned subtask',parentId:'task',done:false,createdAt:1,updatedAt:1}]}},version:4},files:{state:{categories:[{id:'fixture',name:'Owned fence',createdAt:1}],items:[]},version:2},fences:{state:{fences:{fixture:{...normal,open:true,ghost:false,pinned:true,form}}},version:1},'ai-providers':{state:{providers:[],defaultTextId:null},version:1},'knowledge-settings':{state:{vaultRoot:null,shortcut:''},version:1},'search-settings':{state:{shortcut:'',documentRoots:[],nameRoots:[],documentIndexEnabled:false,pinyinEnabled:false},version:1}};
const monitor={name:'Owned monitor',position:{x:0,y:0},size:{width:1280,height:800},workArea:{position:{x:0,y:0},size:{width:1280,height:760}},scaleFactor:1};
const monitorId='Owned monitor@0,0',key=groupKey(monitorId,'right');
fixtures['edge-workspace']={state:{groups:{[key]:{monitorId,edge:'right',offset:48,collapsed:false,order:[]}}},version:1};
if(params.has('occupied'))fixtures['todo-papers'].state.papers['2099-10-19']={...normal,open:true,form:'capsule',edge:'left',edgeY:48,edgeMonitor:monitorId};
if(params.has('crowded'))for(let i=0;i<40;i++)fixtures.fences.state.fences['crowded-'+i]={...normal,open:true,form:'capsule',edge:'right',edgeMonitor:monitorId};
if(params.has('hub')){fixtures['todo-papers'].state.papers[date].open=false;fixtures.fences.state.fences.fixture.open=false;}
const label=params.has('hub')?'edge-hub-'+key:fence?'fence-fixture':`todo-${date}`;
window.edgeReview={fixtures,calls:[],position:{x:normal.x,y:normal.y},size:{width:normal.w,height:normal.h},monitor,monitors:[monitor],visible:false,delay:0,fail:null,emit:(action)=>emitTo(label,'desktop://window-action',{action}),fire:(event,payload)=>emitTo(label,event,payload)};
const listeners=new Map();
mockIPC(async(cmd,args)=>{
 const r=window.edgeReview;r.calls.push({cmd,args});
 if(cmd==='plugin:event|listen'){listeners.set(args.handler,args);return args.handler;}
 if(cmd==='plugin:event|unlisten'){listeners.delete(args.eventId);return null;}
 if(cmd==='plugin:event|emit'||cmd==='plugin:event|emit_to'){
   if(args.event==='desktop://hub-ready')queueMicrotask(()=>emitTo(label,'desktop://hub-visibility',{visible:true}));
   for(const [id,listener]of listeners)if(listener.event===args.event&&(!args.target?.label||args.target.label===label)&&window.__TAURI_INTERNALS__.callbacks.has(id))window.__TAURI_INTERNALS__.runCallback(id,{event:args.event,payload:args.payload,id});
   return null;
 }
 if(r.fail===cmd)throw new Error('OWNED_IPC_FAILURE');
 if(cmd==='read_json'){if(params.has('slow')&&args.key==='todo-papers')await new Promise(resolve=>setTimeout(resolve,200));return structuredClone(fixtures[args.key]??null);}
 if(cmd==='write_json'){fixtures[args.key]=structuredClone(args.value);return args.value;}
 if(cmd==='get_data_dir')return 'E:/OwnedFixture';
 if(cmd==='window_ready'||cmd.endsWith('|show'))r.visible=true;
 if(cmd.endsWith('|hide'))r.visible=false;
 if(cmd.endsWith('|outer_position'))return {...r.position};
 if(cmd.endsWith('|inner_size')||cmd.endsWith('|outer_size'))return {...r.size};
 if(cmd.endsWith('|scale_factor'))return monitor.scaleFactor;
 if(cmd.endsWith('|current_monitor')||cmd.endsWith('|primary_monitor'))return params.has('nomonitor')||params.has('allmonitorsmissing')?null:monitor;
 if(cmd.endsWith('|available_monitors'))return params.has('allmonitorsmissing')?[]:r.monitors;
 if(cmd==='desktop_wait_drag_end')return r.holdDragWait?await new Promise(resolve=>{r.finishDrag=resolve;}):true;
 if(cmd.endsWith('|start_dragging')){if(r.dragTarget)r.position={...r.dragTarget};return null;}
 if(cmd.endsWith('|cursor_position'))return {x:20,y:20};
 if(cmd.endsWith('|set_size')){if(r.delay)await new Promise(resolve=>setTimeout(resolve,r.delay));const v=args.value,data=v.size||v.Physical||v.Logical||v.data||v;r.size={width:data.width,height:data.height};}
 if(cmd.endsWith('|set_position')){if(r.delay)await new Promise(resolve=>setTimeout(resolve,r.delay));const v=args.value,data=v.position||v.Physical||v.Logical||v.data||v;r.position={x:data.x,y:data.y};}
 if(cmd==='plugin:window|get_all_windows'||cmd==='plugin:webview|get_all_webviews')return [];
 return null;
});
mockWindows(label);
const {SOURCE_LIST}=await import('/src/sources/registry.ts');for(const source of SOURCE_LIST)source.fetch=async()=>[];
await import('/src/main.tsx');
</script></body></html>
