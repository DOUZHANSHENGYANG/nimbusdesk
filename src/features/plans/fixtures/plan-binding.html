<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div id="root" style="min-height:100vh;padding:24px"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {mockIPC,mockWindows} from '@tauri-apps/api/mocks';
const fixtures={},calls=[];
window.bindingReview={fixtures,calls};
mockIPC(async(cmd,args)=>{
 calls.push({cmd,args});
 if(cmd==='read_json')return structuredClone(fixtures[args.key]??null);
 if(cmd==='write_json'){fixtures[args.key]=structuredClone(args.value);return args.value;}
 if(cmd==='write_plan_pair'){fixtures.plans=structuredClone(args.plans);fixtures['plans-archive']=structuredClone(args.archive);return {plans:args.plans,archive:args.archive};}
 if(cmd==='plugin:event|listen')return 1;
 if(cmd==='get_data_dir')return 'E:/BindingFixture';
 return null;
});
mockWindows('main');
const {todayStr}=await import('/src/features/plans/types.ts');
const {emptyProjectData}=await import('/src/features/projects/types.ts');
const today=todayStr(),stamp={createdAt:1,updatedAt:1};
fixtures.plans={version:4,state:{days:{[today]:[
 {id:'task-1',parentId:null,title:'对齐导出模板的两处列宽',done:false,createdAt:1,updatedAt:1},
 {id:'task-2',parentId:'task-1',title:'先量一遍现有列宽',done:false,createdAt:1,updatedAt:1}
]}}};
const data=emptyProjectData();
data.projects=[{...stamp,id:'project-portal',name:'业务门户',areaId:null,note:'',status:'active',folder:null}];
data.items=[
 {...stamp,id:'item-alpha',title:'完善采购页面',projectId:'project-portal',areaId:null,note:'',status:'doing',deadline:null,activeIterationId:null},
 {...stamp,id:'item-beta',title:'导出模板留白对不齐',projectId:null,areaId:null,note:'',status:'todo',deadline:null,activeIterationId:null},
 {...stamp,id:'item-gamma',title:'旧版筛选器下线',projectId:'project-portal',areaId:null,note:'',status:'cancelled',deadline:null,activeIterationId:null},
];
fixtures.projects={version:1,state:data};
await import('/src/index.css');
const {i18n,I18nextProvider}=await import('/src/lib/i18n.ts');
const {usePlans}=await import('/src/features/plans/store.ts');
const {PlanBinding}=await import('/src/features/projects/plan-binding.tsx');
window.bindingReview.stores={usePlans};
document.documentElement.classList.add('dark');
function Harness(){
 const day=usePlans(s=>s.days[today]);
 const task=day?.find(t=>t.id==='task-1');
 const child=day?.find(t=>t.id==='task-2');
 return React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:'16px'}},
  React.createElement('p',{style:{fontSize:'12px',opacity:.6}},'顶层计划（可选：继承/游离/各项目工作项）'),
  task?React.createElement(PlanBinding,{date:today,task}):null,
  React.createElement('p',{style:{fontSize:'12px',opacity:.6}},'子计划（应显示「继承父计划」）'),
  child?React.createElement(PlanBinding,{date:today,task:child}):null);
}
createRoot(document.getElementById('root')).render(React.createElement(I18nextProvider,{i18n},React.createElement(Harness)));
</script></body></html>
