<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div id="root" style="min-height:100vh;padding:24px"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {mockIPC,mockWindows} from '@tauri-apps/api/mocks';
const fixtures={},calls=[];
window.outlineReview={fixtures,calls};
mockIPC(async(cmd,args)=>{
 calls.push({cmd,args});
 if(cmd==='read_json')return structuredClone(fixtures[args.key]??null);
 if(cmd==='write_json'){fixtures[args.key]=structuredClone(args.value);return args.value;}
 if(cmd==='write_plan_pair'){fixtures.plans=structuredClone(args.plans);fixtures['plans-archive']=structuredClone(args.archive);return {plans:args.plans,archive:args.archive};}
 if(cmd==='plugin:event|listen')return 1;
 if(cmd==='get_data_dir')return 'E:/OutlineFixture';
 return null;
});
mockWindows('main');
const {todayStr,addDays}=await import('/src/features/plans/types.ts');
const today=todayStr(),tomorrow=addDays(today,1);
fixtures.plans={version:4,state:{days:{[today]:[
 {id:'task-1',parentId:null,title:'对齐导出模板的两处列宽',note:'导出时右侧会溢出一列',done:false,createdAt:1,updatedAt:1},
 {id:'task-2',parentId:'task-1',title:'先量一遍现有列宽',done:true,createdAt:1,updatedAt:1},
 {id:'task-3',parentId:null,title:'导出后把表头和列宽拿真数据再核一遍',done:false,createdAt:2,updatedAt:2}
]}}};
await import('/src/index.css');
const {i18n,I18nextProvider}=await import('/src/lib/i18n.ts');
const {usePlans}=await import('/src/features/plans/store.ts');
const {ModalProvider}=await import('/src/components/shell/modal-host.tsx');
const {OutlineView}=await import('/src/features/plans/views/outline.tsx');
const {KanbanView}=await import('/src/features/plans/views/kanban.tsx');
/** ?view=kanban 挂看板，默认挂大纲 —— 两个视图共用这一份夹具数据 */
const kanbanView=new URLSearchParams(location.search).get('view')==='kanban';
window.outlineReview.stores={usePlans};
window.outlineReview.days={today,tomorrow};
document.documentElement.classList.add('dark');
createRoot(document.getElementById('root')).render(
 React.createElement(I18nextProvider,{i18n},
  React.createElement(ModalProvider,null,
   React.createElement(kanbanView?KanbanView:OutlineView,{date:today}))));
</script></body></html>
