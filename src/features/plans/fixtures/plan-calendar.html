<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div id="root" style="min-height:100vh;padding:24px"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {mockIPC,mockWindows} from '@tauri-apps/api/mocks';
const fixtures={},calls=[];
window.calendarReview={fixtures,calls};
mockIPC(async(cmd,args)=>{
 calls.push({cmd,args});
 if(cmd==='read_json')return structuredClone(fixtures[args.key]??null);
 if(cmd==='write_json'){fixtures[args.key]=structuredClone(args.value);return args.value;}
 if(cmd==='write_plan_pair'){fixtures.plans=structuredClone(args.plans);fixtures['plans-archive']=structuredClone(args.archive);return {plans:args.plans,archive:args.archive};}
 if(cmd==='plugin:event|listen')return 1;
 if(cmd==='get_data_dir')return 'E:/CalendarFixture';
 return null;
});
mockWindows('main');
const {todayStr,fmtDate}=await import('/src/features/plans/types.ts');
const today=todayStr();
const year=Number(today.slice(0,4));

// 确定性的伪随机：同一份夹具每次渲染完全一样，截图可比对
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6d2b79f5)>>>0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const TITLES=['晨跑','制定营销策略','产品评审','拿快递','线上会议','部门培训','看展','和妈妈逛街','瑜伽课','写周报','买菜','读书','复盘','健身','看牙医','交作业'];
// 故意留一条长的：年视图一格只有 ~55px，要能看出是截断而不是撑破网格
const LONG='把上季度所有渠道的转化数据重新导一遍并核对口径';

const days={};
let seq=0;
for(let month=0;month<12;month++){
 const r=rng(year*100+month);
 for(let d=0;d<11;d++){
  const day=1+Math.floor(r()*28);
  const date=fmtDate(new Date(year,month,day));
  const count=1+Math.floor(r()*4);
  const tasks=[];
  for(let k=0;k<count;k++){
   const h=7+Math.floor(r()*13);
   tasks.push({
    id:`task-${++seq}`,parentId:null,
    title:k===1&&r()<0.12?LONG:TITLES[Math.floor(r()*TITLES.length)],
    start:`${String(h).padStart(2,'0')}:00`,
    end:`${String(Math.min(h+1,23)).padStart(2,'0')}:00`,
    done:r()<0.35,createdAt:seq,updatedAt:seq,
   });
  }
  days[date]=tasks;
 }
}

fixtures.plans={version:4,state:{days}};
await import('/src/index.css');
const {i18n,I18nextProvider}=await import('/src/lib/i18n.ts');
const {ModalProvider}=await import('/src/components/shell/modal-host.tsx');
const {ScheduleView}=await import('/src/features/plans/views/schedule.tsx');
window.calendarReview.days=days;window.calendarReview.year=year;window.calendarReview.today=today;
document.documentElement.classList.add('dark');
createRoot(document.getElementById('root')).render(
 React.createElement(I18nextProvider,{i18n},
  React.createElement(ModalProvider,null,
   React.createElement(ScheduleView,{date:today,mode:'year',onPick:()=>{}}))));
</script></body></html>
