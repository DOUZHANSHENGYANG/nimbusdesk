<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div id="root" style="height:100vh"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {HashRouter} from 'react-router-dom';
import {mockIPC,mockWindows} from '@tauri-apps/api/mocks';
const fixtures={},calls=[],secrets=new Map();
const params=new URLSearchParams(location.search);
const review=window.zenReview={fixtures,calls,fetchError:null,unavailable:false,hold:false,release:null};
const envelope=value=>structuredClone(value);
mockIPC(async(cmd,args)=>{
  // Deliberately never record credential values, even in fixture diagnostics.
  calls.push({cmd,args:cmd==='zentao_test_connection'?{connectionId:args.connectionId,hasPassword:Boolean(args.password),hasToken:Boolean(args.token)}:envelope(args)});
  if(cmd==='read_json')return envelope(fixtures[args.key]??null);
  if(cmd==='write_json'){fixtures[args.key]=envelope(args.value);return envelope(args.value);}
  if(cmd==='write_plan_pair'){fixtures.plans=envelope(args.plans);fixtures['plans-archive']=envelope(args.archive);return {plans:args.plans,archive:args.archive};}
  if(cmd==='project_apply_remote_binding'){
    fixtures.projects=envelope(args.projects);fixtures.plans=envelope(args.plans);fixtures['plans-archive']=envelope(args.archive);
    return {projects:envelope(args.projects),plans:envelope(args.plans),archive:envelope(args.archive)};
  }
  if(cmd==='zentao_secret_status')return secrets.get(args.connectionId)??{hasPassword:false,hasToken:false,apiVersion:null};
  if(cmd==='zentao_forget_secret'){secrets.delete(args.connectionId);return null;}
  if(cmd==='zentao_test_connection'){
    const connection=fixtures.zentao.state.connections.find(c=>c.id===args.connectionId);
    if(!connection?.baseUrl||!connection.account)throw Error('ZenTao connection is incomplete.');
    if(!args.password&&!args.token&&!secrets.has(args.connectionId))throw Error('ZenTao authentication is required.');
    const apiVersion=connection.apiVersion==='v1'?'v1':'v2';
    secrets.set(args.connectionId,{hasPassword:Boolean(args.password),hasToken:Boolean(args.token),apiVersion});
    return {apiVersion,account:connection.account};
  }
  if(cmd==='zentao_fetch_tasks'){
    if(review.hold)await new Promise(resolve=>{review.release=()=>{review.hold=false;resolve();};});
    if(review.fetchError)throw Error(review.fetchError);
    const connection=fixtures.zentao.state.connections.find(c=>c.id===args.connectionId),id=connection.id,now=Date.now();
    const task={id:`${id}:task:123`,connectionId:id,remoteId:123,title:'禅道采购任务',note:'<img src=x onerror=alert(1)> 来源说明',status:'doing',deadline:null,start:null,remoteProjectId:8,executionId:12,parentRemoteId:null,assignedTo:connection.account,teamAccounts:[],lastEditedDate:null,updatedAt:now};
    return {apiVersion:connection.apiVersion==='v1'?'v1':'v2',tasks:review.unavailable?[]:[task],executions:[{id:`${id}:execution:12`,connectionId:id,remoteId:12,name:'禅道采购迭代',start:null,end:null,status:'doing',updatedAt:now}],unavailableIds:review.unavailable?[123]:[],fetchedAt:now};
  }
  if(cmd==='zentao_open_task')return null;
  if(cmd==='plugin:event|listen')return 1;
  if(cmd==='get_data_dir')return 'E:/ZenTaoFixture';
  return null;
});
mockWindows('main');
const {todayStr,addDays}=await import('/src/features/plans/types.ts');
const {emptyProjectData}=await import('/src/features/projects/types.ts');
const today=todayStr(),stamp={createdAt:1,updatedAt:1},data=emptyProjectData();
data.iterations=[{...stamp,id:'iteration-old',name:'历史迭代',start:addDays(today,-21),end:addDays(today,-8)},{...stamp,id:'iteration-now',name:'当前迭代',start:addDays(today,-2),end:addDays(today,10)}];
data.items=[{...stamp,id:'local-task',title:'本地采购任务',note:'本地记录保留',projectId:null,areaId:null,status:'doing',deadline:null,activeIterationId:'iteration-now'}];
data.memberships=[{id:'membership-old',itemId:'local-task',iterationId:'iteration-old',joinedAt:1,leftAt:2,carriedFrom:null,updatedAt:2,snapshot:{title:'早期采购',status:'todo',deadline:null}},{id:'membership-now',itemId:'local-task',iterationId:'iteration-now',joinedAt:2,leftAt:null,carriedFrom:'iteration-old',updatedAt:2}];
fixtures.projects={version:1,state:data};
fixtures.zentao={version:1,state:{connections:[],syncStates:{}}};
fixtures.settings={version:3,state:{theme:params.get('theme')??'dark',lang:params.get('lang')??'zh',sidebarCollapsed:true}};
fixtures.plans={version:4,state:{days:{[today]:[{...stamp,id:'plan-local',parentId:null,title:'本地每日计划',done:false,workItemId:'local-task'},{...stamp,id:'plan-child',parentId:'plan-local',title:'继承的子计划',done:false}]}}};
fixtures['plans-archive']={version:3,state:{days:{[addDays(today,-1)]:{archivedAt:1,tasks:[{...stamp,id:'archive-local',parentId:null,title:'归档采购计划',done:true,workItemId:'local-task'}]}}}};
await import('/src/index.css');
const {i18n,I18nextProvider}=await import('/src/lib/i18n.ts');
const {ModalProvider}=await import('/src/components/shell/modal-host.tsx');
const {ProjectsPage}=await import('/src/features/projects/page.tsx');
const {Toaster}=await import('/src/components/ui/sonner.tsx');
const {useProjects}=await import('/src/features/projects/store.ts');
const {usePlans,usePlansArchive}=await import('/src/features/plans/store.ts');
const {useSettings}=await import('/src/stores/settings.ts');
const {useZentao}=await import('/src/features/projects/zentao-store.ts');
const {flushAllStorage}=await import('/src/lib/storage.ts');
review.stores={useProjects,usePlans,usePlansArchive,useSettings,useZentao};review.flush=flushAllStorage;
document.documentElement.classList.toggle('dark',params.get('theme')!=='light');
createRoot(document.getElementById('root')).render(React.createElement(I18nextProvider,{i18n},React.createElement(ModalProvider,null,React.createElement(HashRouter,null,React.createElement(ProjectsPage)),React.createElement(Toaster))));
</script></body></html>
