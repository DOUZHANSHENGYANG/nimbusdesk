const repos=[
 {id:1,name:'nimbus-desk',full_name:'dz/nimbus-desk',fork:false,description:'本机工作台 · Tauri + React',language:'TypeScript',stargazers_count:128,forks_count:9,default_branch:'main',html_url:'https://github.com/dz/nimbus-desk',pushed_at:'2026-10-30T09:12:00Z',topics:['tauri','desktop']},
 {id:2,name:'oil-ui',full_name:'dz/oil-ui',fork:true,parent:{full_name:'oil-oil/oil-ui'},description:'Forked design skill scratchpad',language:'JavaScript',stargazers_count:3,forks_count:0,default_branch:'main',html_url:'https://github.com/dz/oil-ui',pushed_at:'2026-10-28T11:00:00Z',topics:[]},

if(params.get('gone')==='1')delete repos[1].parent;
const readme=['# nimbus-desk','','A local-first workspace built with Tauri and React.','','## Why','','It keeps your projects, plans and files in one window, and never uploads them.','','- Offline first','- Single storage layer','- Keyboard driven'].join('\n');

const respond=(url,method)=>{
 if(url.startsWith('https://api.github.com/user/starred/'))return {url,status:204,headers:{},body:''};
 if(url.startsWith('https://api.github.com/user/starred'))return json(url,starred);
 if(url.startsWith('https://api.github.com/user/repos')){
  // ?paged=1 让「我的仓库」有两页：第一页满满 100 条，第二页 1 条，用来验翻页。
  if(params.get('paged')==='1'){
   const page=Number(new URL(url).searchParams.get('page')??'1');
   if(page===1)return json(url,Array.from({length:100},(_,index)=>({...repos[0],id:1000+index,name:`repo-${index}`,full_name:`dz/repo-${index}`,fork:false,archived:false,parent:undefined,description:`paged ${index}`})));
   return json(url,[{...repos[0],id:2000,name:'tail-repo',full_name:'dz/tail-repo',fork:false,parent:undefined,description:'second page'}]);
  }
  return json(url,repos);
 }
 if(url==='https://api.github.com/user')return json(url,{login:'dz',name:'Dz',avatar_url:''});
 if(url.startsWith('https://github.com/trending'))return {url,status:200,headers:{'content-type':'text/html'},body:trendingHtml};
 if(url.startsWith('https://raw.githubusercontent.com/'))return {url,status:200,headers:{'content-type':'text/plain'},body:readme};
 if(/^https:\/\/api\.github\.com\/repos\/[^/]+\/[^/]+\/readme$/.test(url))return {url,status:200,headers:{'content-type':'text/plain'},body:readme};
 if(url.startsWith('https://edge.microsoft.com/translate/translatetext'))return json(url,[{detectedLanguage:{language:'en'},translations:[{text:'一个用 Tauri 和 React 构建的本地优先工作台。'}]}]);
 return {url,status:404,headers:{},body:'not found'};
};
let rid=1;const pending=new Map();
const decoder=new TextDecoder();
const requestBody=data=>{ if(typeof data==='string')return data; if(Array.isArray(data))return decoder.decode(new Uint8Array(data)); return ''; };

mockIPC(async(cmd,args)=>{
 calls.push({cmd,args:cmd==='github_save_token'?{hasToken:Boolean(args.token)}:envelope(args)});
 if(cmd==='read_json')return envelope(fixtures[args.key]??null);
 if(cmd==='write_json'){fixtures[args.key]=envelope(args.value);return envelope(args.value);}
 if(cmd==='github_token_status')return {source:params.get('token')==='none'?'none':'vault'};
 if(cmd==='github_token'){ if(params.get('token')==='none')throw Error('GITHUB_TOKEN_MISSING'); return 'ghp_fixturefixturefixturefixture'; }
 if(cmd==='github_save_token')return null;
 if(cmd==='github_forget_token')return null;
 if(cmd==='github_default_download_dir')return 'E:/Downloads';
 if(cmd==='github_download_zip'){calls.push({cmd,args:{owner:args.owner,repo:args.repo,branch:args.branch,dir:args.dir}});return {path:`${args.dir??'E:/Downloads'}/${args.repo}-${args.branch}.zip`,bytes:2048};}
 if(cmd==='plugin:http|fetch'){
  // 发出去就记账：被闸门挂住的请求也算一次轮询
  review.http.push({url:args.clientConfig.url,method:args.clientConfig.method??'GET'});
  // ?hold=1：网络先挂住，测试端调用 window.githubReview.releaseAll() 再放行，
  // 用来确定性地验「先渲染缓存、再后台对齐」。
  if(params.get('hold')==='1')await new Promise(resolve=>{review.held.push(resolve);});
  const method=args.clientConfig.method??'GET';
  if(params.get('starfail')==='1'&&(method==='PUT'||method==='DELETE')&&/\/user\/starred\//.test(args.clientConfig.url)){
   const response={url:args.clientConfig.url,status:500,headers:{},body:'boom'};
   pending.set(rid,response);
   return rid++;
  }
  const response=respond(args.clientConfig.url,method);
  pending.set(rid,response);
  return rid++;
 }
 if(cmd==='plugin:http|fetch_send'){const response=pending.get(args.rid);return {status:response.status,statusText:'OK',url:response.url,headers:response.headers,rid:args.rid};}
 if(cmd==='plugin:http|fetch_read_body'){
  const response=pending.get(args.rid);
  if(response.sent)return new Uint8Array([1]);
  response.sent=true;
  const bytes=new TextEncoder().encode(response.body);
  const out=new Uint8Array(bytes.length+1);
  out.set(bytes);
  return out;
 }
 if(cmd==='plugin:http|fetch_cancel'||cmd==='plugin:http|fetch_cancel_body')return null;
 if(cmd==='plugin:event|listen')return 1;
 if(cmd==='get_data_dir')return 'E:/GithubFixture';
 return null;
});
