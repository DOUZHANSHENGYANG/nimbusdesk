[package]
name = "nimbusdesk"
version = "0.1.0"
description = "NimbusDesk 云台 — 个人桌面绿色工作台"
authors = ["dz"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pinyin = { version = "=0.11.0", default-features = false, features = ["plain", "heteronym"] }
lopdf = { version = "=0.42.0", default-features = false }
zip = { version = "=9.0.4", default-features = false, features = ["deflate"] }
quick-xml = "=0.41.0"
rusqlite = { version = "=0.37.0", features = ["bundled", "backup"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "json"] }
tauri-plugin-http = "2"
png = "0.17"
base64 = "0.22"
tauri-plugin-notification = "2.7.0"
tauri-plugin-global-shortcut = "2"

[target."cfg(windows)".dependencies]
everything-ipc = "=0.1.4"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_System_JobObjects",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_Storage_FileSystem",
  "Win32_Storage_IndexServer",
  "Win32_UI_Shell",
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[patch.crates-io]
everything-ipc = { path = "vendor/everything-ipc" }
