<!doctype html>
<html lang="zh" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <!--
      启动底色的兜底值必须与 tokens.css 的 --pr-gray-950 一致（真无彩）。
      旧值 #101014 反算色相是 H=285.5° —— 落在紫区，每次启动/重绘
      都会先闪一层紫黑底，这正是「残留紫色感」的来源之一。
    -->
    <meta name="theme-color" content="#0c0c0c" />
    <title>NimbusDesk 云台</title>
    <style>
      /* 防白闪底色：与默认暗色主题一致（--pr-gray-950，C=0 纯灰） */
      html {
        background: #0c0c0c;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script>
      // 启动错误可视化：若 React 挂载前/中崩溃，把错误画在页面上
      window.addEventListener("error", function (e) {
        var box = document.getElementById("boot-error");
        if (!box) {
          box = document.createElement("div");
          box.id = "boot-error";
          box.style.cssText =
            "position:fixed;inset:0;z-index:99999;background:#0c0c0c;color:#ff6b6b;" +
            "font:12px/1.6 Consolas,monospace;padding:16px;white-space:pre-wrap;overflow:auto;";
          document.body.appendChild(box);
        }
        box.textContent +=
          (e.message || "unknown error") +
          "\n  at " +
          (e.filename || "?") +
          ":" +
          (e.lineno || 0) +
          "\n\n";
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
