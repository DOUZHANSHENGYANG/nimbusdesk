<!doctype html>
<html lang="zh" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101014" />
    <title>NimbusDesk 云台</title>
    <style>
      /* 防白闪底色：与默认暗色主题一致 */
      html {
        background: #101014;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script>
      // 启动错误可视化：若 React 挂载前/中崩溃，把错误画在页面上
      window.addEventListener("error", function (e) {
        var box = document.getElementById("boot-error");
        if (!box) {
          box = document.createElement("div");
          box.id = "boot-error";
          box.style.cssText =
            "position:fixed;inset:0;z-index:99999;background:#101014;color:#ff6b6b;" +
            "font:12px/1.6 Consolas,monospace;padding:16px;white-space:pre-wrap;overflow:auto;";
          document.body.appendChild(box);
        }
        box.textContent +=
          (e.message || "unknown error") +
          "\n  at " +
          (e.filename || "?") +
          ":" +
          (e.lineno || 0) +
          "\n\n";
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
