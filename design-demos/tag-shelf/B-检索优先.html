<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方向 B · 检索优先</title>
<style>
  :root{
    --bg:#0a0a0b; --surface:#131316; --surface-2:#17171b; --surface-3:#1d1d22;
    --border:#26262b; --border-soft:#1f1f24;
    --text:#f2f2f4; --muted:#8b8b94; --dim:#6b6b74;
    --primary:#2f6bff; --primary-soft:rgba(47,107,255,.15);
    --g1:#5b8def; --g2:#c084fc; --g3:#4ade80; --g4:#fbbf24;
    --r:12px; --font:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;height:900px;overflow:hidden}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .topbar{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px}
  .topbar h1{font-size:18px;font-weight:600}
  .spacer{flex:1}
  .btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}

  .wrap{padding:0 24px;position:relative}

  /* ── 检索条 ── */
  .finder{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border:1px solid #3a3a44;border-radius:14px;background:var(--surface);box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .finder .q{font-size:14px;color:var(--text)}
  .finder .q em{font-style:normal;color:var(--primary);background:var(--primary-soft);border-radius:4px;padding:1px 4px}
  .finder .caret{width:1px;height:16px;background:var(--text);opacity:.7;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .finder .keys{margin-left:auto;display:flex;gap:6px}
  .finder .keys kbd{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--border);border-radius:4px;padding:2px 5px}

  /* ── 条件行 ── */
  .conds{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;color:var(--dim)}
  .cond{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:6px;background:var(--primary-soft);border:1px solid rgba(47,107,255,.35);color:#bcd2ff;font-size:11.5px}
  .cond span{color:#7d9fe0;font-size:10px}
  .mode{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .mode i{font-style:normal;padding:2px 7px;font-size:10px;font-family:var(--mono);color:var(--dim)}
  .mode i.on{background:var(--surface-3);color:var(--text)}
  .conds .save{margin-left:auto;color:var(--muted);font-size:11px}

  /* ── 弹出的分组面板 ── */
  .palette{margin-top:10px;border:1px solid #33333c;border-radius:14px;background:#141418;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden;width:640px}
  .pal-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border-soft);font-size:11px;color:var(--dim)}
  .pal-head b{color:var(--muted);font-weight:500}
  .pal-head .scope{margin-left:auto;font-family:var(--mono);font-size:10px}
  .pal-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border-soft)}
  .pal-group{background:#141418;padding:12px 14px 14px}
  .pal-group h4{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:#d9d9df;margin-bottom:9px}
  .pal-group h4 .dot{width:6px;height:6px;border-radius:2px}
  .pal-group h4 .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim);font-weight:400}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{height:24px;padding:0 9px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);font-size:11.5px;color:#cfcfd6}
  .chip .c{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-left:5px}
  .chip.on{background:var(--primary-soft);border-color:rgba(47,107,255,.45);color:#bcd2ff}
  .pal-foot{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--border-soft);font-size:10.5px;color:var(--dim)}
  .pal-foot .rec{display:flex;align-items:center;gap:5px}
  .pal-foot .rec b{font-weight:500;color:var(--muted)}
  .pal-foot .hint{margin-left:auto}

  /* ── 结果 ── */
  .results{margin-top:16px}
  .rhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:11.5px;color:var(--dim)}
  .rhead b{color:var(--text);font-weight:500;font-size:12px}
  .rhead .toggle{margin-left:auto;display:flex;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
  .rhead .toggle span{padding:3px 9px;border-radius:6px;font-size:11px;color:var(--dim)}
  .rhead .toggle span.on{background:var(--surface-3);color:var(--text)}
  .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .card{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px;min-height:132px;opacity:.55}
  .card.hot{opacity:1;border-color:#3a3a44}
  .card h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .card .badge{margin-left:auto;font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:2px 7px;font-weight:400}
  .card p{font-size:12px;line-height:1.55;color:var(--muted)}
  .card .tags{display:flex;gap:4px;margin-top:auto}
  .card .tg{font-size:10.5px;color:#b9b9c2;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:5px;padding:2px 6px;display:inline-flex;align-items:center;gap:5px}
  .card .tg i{width:5px;height:5px;border-radius:1px}
</style>
</head>
<body>

<header class="topbar">
  <h1>技能</h1>
  <div class="spacer"></div>
  <button class="btn">扫描本机</button>
  <button class="btn primary">＋ 添加技能</button>
</header>

<div class="wrap">
  <div class="finder">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b8b94" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span class="q"><em>#代码</em> <em>#审查</em> <span class="caret"></span></span>
    <span class="keys"><kbd>↑↓</kbd><kbd>↵</kbd><kbd>esc</kbd></span>
  </div>

  <div class="conds">
    <span>条件</span>
    <span class="cond">代码 <span>×</span></span>
    <span class="cond">审查 <span>×</span></span>
    <div class="mode"><i class="on">与</i><i>或</i></div>
    <span class="save">＋ 存为预设</span>
  </div>

  <div class="palette">
    <div class="pal-head"><b>标签</b><span>输入筛选，组内可多选</span><span class="scope">12 个标签 / 4 组</span></div>
    <div class="pal-grid">
      <section class="pal-group">
        <h4><span class="dot" style="background:var(--g1)"></span>领域<span class="n">4</span></h4>
        <div class="chips">
          <button class="chip on">代码<span class="c">8</span></button>
          <button class="chip">设计<span class="c">3</span></button>
          <button class="chip">写作<span class="c">2</span></button>
          <button class="chip">运维<span class="c">1</span></button>
        </div>
      </section>
      <section class="pal-group">
        <h4><span class="dot" style="background:var(--g2)"></span>阶段<span class="n">4</span></h4>
        <div class="chips">
          <button class="chip">规划<span class="c">2</span></button>
          <button class="chip">实现<span class="c">5</span></button>
          <button class="chip on">审查<span class="c">3</span></button>
          <button class="chip">发布<span class="c">1</span></button>
        </div>
      </section>
      <section class="pal-group">
        <h4><span class="dot" style="background:var(--g3)"></span>来源<span class="n">3</span></h4>
        <div class="chips">
          <button class="chip">本地<span class="c">6</span></button>
          <button class="chip">团队<span class="c">4</span></button>
          <button class="chip">市场<span class="c">2</span></button>
        </div>
      </section>
      <section class="pal-group">
        <h4><span class="dot" style="background:var(--g4)"></span>状态<span class="n">3</span></h4>
        <div class="chips">
          <button class="chip">常用<span class="c">4</span></button>
          <button class="chip">待整理<span class="c">3</span></button>
          <button class="chip">归档<span class="c">2</span></button>
        </div>
      </section>
    </div>
    <div class="pal-foot">
      <span class="rec">最近 <b>代码 · 审查</b></span>
      <span class="hint">Tab 在组间跳 · ↵ 应用 · ⌥↵ 存为预设</span>
    </div>
  </div>

  <div class="results">
    <div class="rhead"><b>3 个技能</b><span>按最近使用排序</span>
      <div class="toggle"><span class="on">网格</span><span>分组</span></div>
    </div>
    <div class="cards">
      <article class="card hot">
        <h3>代码评审 <span class="badge">本地</span></h3>
        <p>按团队规范过一遍 diff，指出风险点与可读性问题。</p>
        <div class="tags">
          <span class="tg"><i style="background:var(--g1)"></i>代码</span>
          <span class="tg"><i style="background:var(--g2)"></i>审查</span>
          <span class="tg"><i style="background:var(--g3)"></i>团队</span>
        </div>
      </article>
      <article class="card">
        <h3>前端设计 <span class="badge">团队</span></h3>
        <p>页面版式、层级与间距的评审，输出可直接落地的改法。</p>
        <div class="tags">
          <span class="tg"><i style="background:var(--g1)"></i>设计</span>
          <span class="tg"><i style="background:var(--g2)"></i>审查</span>
        </div>
      </article>
      <article class="card">
        <h3>调试排错 <span class="badge">本地</span></h3>
        <p>从报错栈回溯到最小复现，给出可验证的修复路径。</p>
        <div class="tags">
          <span class="tg"><i style="background:var(--g1)"></i>代码</span>
        </div>
      </article>
    </div>
  </div>
</div>
</body>
</html>
